<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MGTS BTEC Feedback Studio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://unpkg.com/html-docx-js/dist/html-docx.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    :root {
      --ink: #231f20;
      --ink-soft: #575756;
      --panel: #ffffff;
      --line: #dbcdb8;
      --accent: #fbb801;
      --accent-strong: #e5a800;
      --ok: #166534;
      --warn: #b45309;
    }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      background-color: #f8fafc;
    }
    h1, h2, h3, .brand-font {
      font-family: 'Manrope', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 10px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
    <div class="flex items-center gap-4">
      <div class="w-10 h-10 bg-[#fbb801] rounded-xl flex items-center justify-center font-bold text-slate-900 text-xl shadow-lg shadow-yellow-500/20">M</div>
      <div>
        <h1 class="text-slate-900 font-extrabold tracking-tight text-lg leading-tight">MGTS</h1>
        <span class="text-[10px] uppercase tracking-widest font-black text-slate-500">Feedback Studio</span>
      </div>
    </div>
    <div class="flex gap-4 items-center">
      <div id="auth-status" class="flex items-center gap-3">
        <span id="user-badge" class="hidden text-xs font-bold bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200"></span>
        <button id="auth-btn" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-slate-800 transition-all">Sign In</button>
      </div>
    </div>
  </header>

  <main class="flex-1 flex flex-col max-w-7xl mx-auto w-full p-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Left Column: Inputs -->
      <section class="md:col-span-2 space-y-6">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
          <div class="flex justify-between items-center">
            <h2 class="text-sm font-black uppercase tracking-widest text-slate-400">Portfolio Ingestion</h2>
            <div class="flex bg-slate-100 p-1 rounded-lg">
              <button class="px-4 py-1 text-[10px] font-black uppercase rounded-md bg-white text-indigo-600 shadow-sm">Formative</button>
              <button class="px-4 py-1 text-[10px] font-black uppercase rounded-md text-slate-400">Summative</button>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <input type="text" placeholder="Learner Name" class="px-4 py-2 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-[#fbb801]">
            <select class="px-4 py-2 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-[#fbb801]">
              <option>Level 3 (Nationals)</option>
              <option>Level 4 (HNC)</option>
              <option>Level 5 (HND)</option>
            </select>
          </div>
          <textarea 
            class="w-full h-96 p-6 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium leading-relaxed outline-none focus:border-[#fbb801] shadow-inner resize-none custom-scrollbar"
            placeholder="Paste portfolio text here or upload files..."
          ></textarea>
          <div class="flex justify-end gap-3">
            <button class="px-6 py-2 border border-slate-200 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-slate-50">Upload File</button>
            <button class="px-6 py-2 bg-[#fbb801] rounded-xl text-xs font-black uppercase tracking-widest shadow-lg shadow-yellow-500/20 hover:bg-yellow-500">Run Evaluation</button>
          </div>
        </div>
      </section>

      <!-- Right Column: Criteria -->
      <aside class="space-y-6">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-full flex flex-col">
          <h2 class="text-sm font-black uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#fbb801]"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/></svg>
            Mastery Model Logic
          </h2>
          <div class="space-y-3 flex-1 overflow-y-auto custom-scrollbar pr-2">
            <!-- Criterion Card -->
            <div class="p-4 border border-slate-100 bg-slate-50/50 rounded-xl space-y-2 group hover:border-emerald-200 hover:bg-emerald-50/20 transition-all">
              <div class="flex justify-between items-start">
                <span class="text-[10px] font-black px-2 py-1 bg-blue-100 text-blue-700 rounded-lg">P1</span>
                <button class="text-slate-300 hover:text-emerald-500 transition-colors">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </button>
              </div>
              <p class="text-xs font-bold text-slate-700 leading-snug">Describe the primary principles of mechanical engineering systems.</p>
              <div class="text-[10px] font-black uppercase text-slate-400">Status: Pending</div>
            </div>
            <!-- More criteria would go here -->
          </div>
          <div class="mt-6 pt-6 border-t border-slate-100">
            <div class="bg-[#111] p-6 rounded-2xl text-white">
              <span class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 block mb-1">Calculated Outcome</span>
              <div class="text-3xl font-black tracking-tighter">Referral</div>
              <p class="text-[10px] font-bold text-slate-400 mt-2 uppercase tracking-widest">Pending Pass Mastery</p>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
    console.log("MGTS Studio v2.5 Online");
    // Note: Add your specific frontend logic here to connect to the backend /api/evaluate
  </script>
</body>
</html>
